; ============================================
; pytest 配置（后端测试）
; 运行（在项目根目录）：
;   .venv\Scripts\python.exe -m pytest backend -q          # 全量离线测试
;   $env:RUN_LIVE_TESTS=1; .venv\Scripts\python.exe -m pytest backend -m live   # 真实外部服务集成测试
; 说明：scripts/ 下的 test_m*.py 是「直接运行」的里程碑脚本（import 即执行），
;       不是 pytest 用例，必须排除，否则收集阶段就会触发 SystemExit。
; ============================================
[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra
norecursedirs = .* build dist node_modules .venv venv __pycache__ scripts data eval
markers =
    live: 需要真实 LLM / 高德 / Redis 的集成测试（未设 RUN_LIVE_TESTS=1 时整模块跳过）
