# ============================================
# 一键起整套系统：前端(nginx) + 后端(FastAPI) + Redis
# 用法：
#   1) 复制 backend/.env.example → backend/.env 并填好密钥
#   2) 复制 frontend/.env.example → frontend/.env 并填高德 JS Key（构建期需要）
#   3) docker compose up --build
#   4) 浏览器打开 http://localhost:8080
#
# 说明：本机也可以不用 Docker —— 用 start.ps1（Windows）或 start.sh（Linux/macOS）
#       分别起 Redis + 后端，前端另跑 npm run dev。
# ============================================
services:
  redis:
    image: redis:7-alpine
    container_name: travel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: travel-backend
    ports:
      - "8000:8000"
    environment:
      # 容器内用 compose 网络里的服务名 redis，而不是宿主机的 localhost
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    volumes:
      # 持久化：SQLite 行程库 + Chroma 向量库都落在这里
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: travel-frontend
    ports:
      - "8080:80"          # nginx 对外端口；/api 由 nginx 反代到 backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
