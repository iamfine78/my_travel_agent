# ============================================
# 前端 nginx：静态托管 Vue 产物 + 反代后端 API
# 作用：让「前端容器」同时充当统一入口——浏览器只访问 8080，
#       /api 请求由 nginx 转发到 backend 容器，无需前端知道后端地址。
# 对应关系：等同开发期 vite.config.js 里的 server.proxy['/api']
# ============================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端路由（/result、/history）刷新时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代（compose 服务名 backend 即容器 DNS 名）
    # proxy_pass 不带路径，保留完整 URI（/api/trip/plan → backend:8000/api/trip/plan）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 生成行程要串行调 LLM + 高德，耗时可达分钟级，给足超时
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
